name: "1a. Plan Infrastructure"

# The visible half of the BI-D2 gate: every PR that touches infra shows what an
# apply would do, and `tofu-plan` is a required check on `main`, so nothing
# reaches infra unreviewed.
#
# NO CREDENTIAL BEFORE APPROVAL (BI-D23, #179). A PR's code is unreviewed --
# and once the dev App opens PRs here, model-written -- so the job that runs
# `tofu init`/`plan` on it holds no OIDC role and no secret until a maintainer
# approves it. Three jobs:
#   - `detect` holds no cloud credential or secret, and decides whether infra
#     changed;
#   - `credentialed-plan` runs only when it did, on the `infra-plan`
#     Environment (required reviewers, no admin bypass), and is the only job
#     with `id-token: write`. Its inputs are that Environment's secrets, which
#     GitHub releases only after the approval;
#   - `tofu-plan` always runs, even on cancellation, and reports the outcome.
#     Its job id IS the required-check context.
# The plan role (`github-actions-bounty-infra-plan`, global-bootstrap) trusts
# the `environment:infra-plan` subject. The old `:pull_request`-bound subject on the
# plan role (a global-bootstrap change) was retired once this workflow reached
# `main`. That removal is the real control, not this file: a `pull_request`
# run uses the PR's own copy of the workflow, so the Environment subject on
# the plan role is what admits it.
#
# NO SECRET VALUES IN THE PLAN (BI-D23). The plan runs `-refresh=false` with a
# placeholder Vultr key, so it holds no Vultr credential. It compares config to state; it does not show drift, and nothing
# else shows it before it is applied: `deploy-infra.yml` applies with refresh
# and -auto-approve after its approval, so a drift correction lands unseen
# (accepted in BI-D23). If a Vultr data source is ever added to infra/, the plan
# fails with a 401 rather than passing quietly, because data sources are read
# even with -refresh=false -- revisit BI-D23 then.
#
# NO `paths:` FILTER -- deliberate. A required check on a path-filtered workflow
# deadlocks: a PR touching only `docs/` never triggers the workflow, so the
# required check sits pending forever and the PR can never merge. `detect`
# decides internally whether there is anything to plan instead.
#
# APPLY CREDENTIALS NEVER APPEAR HERE. `deploy-infra.yml` keeps the apply role,
# behind the `production` Environment.

on:
  pull_request:

permissions: {}

concurrency:
  group: tofu-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      infra: ${{ steps.changes.outputs.infra }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the merge base is available to the diff below.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect infra changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git diff --name-only "origin/${BASE_REF}...HEAD" > changed.txt
          if grep -qE '^(infra/|\.github/workflows/(plan|deploy)-infra\.yml$)' changed.txt; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
            echo "No changes under infra/ or the infra workflows — nothing to plan." >> "$GITHUB_STEP_SUMMARY"
          fi

  credentialed-plan:
    needs: detect
    if: needs.detect.outputs.infra == 'true'
    runs-on: ubuntu-latest
    # The approval gate. Presenting this Environment is what makes the job's
    # OIDC subject `environment:infra-plan`, which the plan role trusts (see the
    # header for when `:pull_request` stops being trusted too). The timeout runs
    # from the approval, not from the wait for it.
    environment: infra-plan
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      id-token: write # OIDC token for the plan role; the only job in this workflow that holds one
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          # Read-only plan role -- NOT the apply role. An Environment secret, not
          # a `vars.` value: the ARN embeds the account ID, and a vars value
          # passed through `with:` prints unmasked in a public log (BI-D4).
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Error output (an AccessDenied, a backend error) can carry the bare
          # account ID, which the secret mask does not cover (BI-D4).
          mask-aws-account-id: true

      # tofu_wrapper: false -- the default wrapper normalizes -detailed-exitcode's
      # 0 (no changes) AND 2 (changes present) to the same process exit 0 (see
      # opentofu/setup-opentofu's wrapper/tofu.js: `if (exitCode === 0 ||
      # exitCode === 2) { return; }`), so a script reading raw `$?` -- as the
      # next step does -- can never tell the two apart.
      - name: Setup OpenTofu Core
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.0
          tofu_wrapper: false

      - name: OpenTofu plan
        working-directory: ./infra
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          # No dynamodb_table: the plan runs -lock=false and the plan role holds
          # no DynamoDB grant (BI-D23). A plan must never block a concurrent
          # apply on the state lock.
          tofu init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"

          # BI-D4: the plan body renders account-specific values at runtime even
          # though none are committed. On a PUBLIC repo both PR comments and
          # workflow artifacts are world-readable, so the body goes to a file
          # that is never printed and never uploaded -- only resource ADDRESSES
          # and change COUNTS are published, by the next step.
          #
          # BI-D23: -refresh=false and an obviously fake Vultr key. Verified for
          # #179 that no Vultr API call is made this way, and that the plan
          # matches a refreshed real-key plan against main's state.
          set +e
          tofu plan -input=false -lock=false -refresh=false -no-color -detailed-exitcode \
            -out=tfplan.bin \
            -var="aws_region=${AWS_REGION}" \
            -var="vultr_api_key=plan-placeholder-not-a-key" \
            >plan.stdout 2>plan.stderr
          CODE=$?
          set -e

          # -detailed-exitcode: 0 = no changes, 2 = changes present, anything else = error.
          # Log the code itself: it is the one bit of plan outcome that is safe to
          # print (a state, not a value).
          echo "tofu plan exit code: ${CODE} (0 = no changes, 2 = changes present)"

          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 2 ]; then
            echo "::error::tofu plan failed (exit ${CODE}). Diagnostics follow; the plan body stays withheld."
            cat plan.stderr
            exit 1
          fi

      - name: Summarize plan (addresses + counts only)
        working-directory: ./infra
        run: |
          set -euo pipefail
          tofu show -json tfplan.bin > plan.json

          {
            echo "### OpenTofu plan"
            echo
            echo "_Resource addresses and change counts only — the plan body is withheld"
            echo "because it renders account-specific values into a world-readable log (BI-D4)._"
            echo "_Planned with -refresh=false (BI-D23): config against state, not drift._"
            echo
            jq -r '
              [.resource_changes[]? | select(.change.actions | index("no-op") | not)]
              | if length == 0 then
                  "**No changes.** State matches configuration."
                else
                  ("| Action | Address |", "|---|---|"),
                  (.[] | "| `\(.change.actions | join(","))` | `\(.address)` |"),
                  "",
                  "**\(length) resource change(s).** Review before merging — merging to `main` queues an apply."
                end
            ' plan.json
          } >> "$GITHUB_STEP_SUMMARY"

          # Nothing here is uploaded as an artifact; removed anyway so a later step
          # cannot casually pick them up. tfplan.bin embeds full resource values.
          rm -f tfplan.bin plan.json plan.stdout plan.stderr

  # Job id IS the required-check context. Never add a `name:` override here --
  # it renames the check run and silently un-requires the gate.
  tofu-plan:
    needs: [detect, credentialed-plan]
    # always(), not the default and not !cancelled(): with plain `needs`, a
    # failed `detect` would SKIP this job, and a skipped required check counts
    # as passing; with !cancelled(), a cancelled run could skip it the same way.
    # So this job always runs and passes only on an explicit success.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report the plan outcome
        env:
          DETECT: ${{ needs.detect.result }}
          INFRA: ${{ needs.detect.outputs.infra }}
          PLAN: ${{ needs.credentialed-plan.result }}
        run: |
          set -euo pipefail
          if [ "$DETECT" != "success" ]; then
            echo "::error::detect did not succeed (${DETECT}), so whether infra changed is unknown."
            exit 1
          fi
          if [ "$INFRA" = "true" ]; then
            if [ "$PLAN" != "success" ]; then
              echo "::error::Infra changed and credentialed-plan did not succeed (${PLAN}). It needs an approval on the infra-plan Environment; a rejected or failed plan fails this check."
              exit 1
            fi
            echo "Infra changed; the approved plan succeeded."
          else
            echo "No infra change; nothing to plan."
          fi
