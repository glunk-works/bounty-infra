# .ai/project.yml — bounty-infra's parameterization of the `way-of-working` plugin.
#
# The plugin's skills and agents are portable and may never name a repo-specific value;
# where behavior needs one they read it from here. The contract, key by key, is
# `reference/project-schema.md` inside the plugin — read that before adding a key, and note
# its central rule: when a shared skill assumes something untrue about this repo, the fix is
# a new schema key or the skill was never portable. Overriding a skill locally is not an
# option — a repo-local `.claude/skills/<name>/` shadows the plugin's copy entirely and
# silently stops receiving upstream fixes.
#
# Every value below was verified against this repo as it actually is, not copied from the
# SW sprint plan or from project-schema.md's worked example (which was written *from* the
# plan). The ruleset block in particular was read live from the GitHub API on 2026-07-22.

# ── identity ─────────────────────────────────────────────────────────────────
repo: glunk-works/bounty-infra
pr_base: main
migration_base: null

# ── the deep record ──────────────────────────────────────────────────────────
roadmap: docs/hardening_roadmap.md
sprints_dir: sprints

# The roadmap is also the threat model: posture, trust boundaries, and the public-repo
# data-handling rules all live in it. There is no separate threat_model.md and inventing a
# path to one would point security-critic at a file that does not exist.
threat_model: docs/hardening_roadmap.md

decisions:
  log: docs/hardening_roadmap.md   # BI-D1..BI-D23 are recorded there (BI-D21 reserved by #127).
  prefix: BI-D

backlog:
  kind: github_issues              # this repo has no backlog file; findings are issues.
  path: null
  item_prefix: null
  repo: null

planning:
  kind: "github_milestones"

# docs-consistency's audit set. README.md is deliberately absent: CLAUDE.md already records
# that it predates the current architecture and is not trusted over the roadmap, so auditing
# it would re-report known-stale claims (#11 and the phantom build-and-push.yml) every pass.
load_bearing_docs:
  - CLAUDE.md
  - docs/hardening_roadmap.md
  - .ai/next-steps.md
  - sprints/**/sprint_plan.md

# ── what counts as a behavior change ─────────────────────────────────────────
code_paths:
  - src/
  - infra/
  - .github/workflows/

# ── the local green gate ─────────────────────────────────────────────────────
# A local pre-check, not the gate of record — CI on the PR is. Mirrors CLAUDE.md § Commands.
# `tofu validate` runs with -backend=false on purpose so it needs no AWS credentials.
gates:
  green:
    - { cwd: src,   run: hatch run lint:check }
    - { cwd: src,   run: hatch run test:run }
    - { cwd: infra, run: tofu fmt -check -recursive }
    - { cwd: infra, run: "tofu init -backend=false && tofu validate" }

# ── branch protection ────────────────────────────────────────────────────────
# Two repo rulesets on main since the cutover (claude-workbench#406): the checks ruleset and
# the code-owner approval ruleset, neither with a bypass actor. Every required check is pinned
# to GitHub Actions (integration_id 15368). `architect-review` is the commit status the review
# gate posts; it is added to the live checks ruleset right after the PR that adds this list
# merges. `pr-title` runs on every PR but is deliberately NOT required (title format is a
# convention, not a security or correctness gate) — so it must not appear here, or /pr-checks
# would report a gate that does not gate.
rulesets:
  - name: main-required-checks
    source: repo
    rule_types: [required_status_checks]
    required_checks: [lint, test, tofu-validate, tofu-plan,
                      dependency-audit, sbom, secrets-scan, zizmor, architect-review]
  - name: protected-integration-branches
    source: repo
    rule_types: [deletion, non_fast_forward, pull_request]
# Legacy single-ruleset form, kept in step with the checks entry above: most readers still use it.
ruleset:
  name: main-required-checks
  rule_types: [required_status_checks]
  required_checks: [lint, test, tofu-validate, tofu-plan,
                    dependency-audit, sbom, secrets-scan, zizmor, architect-review]

# ── the fresh-session review gate ────────────────────────────────────────────
# .github/workflows/architect-review-gate.yml posts `check` as a commit status on every PR
# into main: `success` when no path under code_paths changed, or when the head carries a
# fresh-session review by identities.reviewer_app; `failure` otherwise. It reads this file
# from main, never from the PR. header and attestation are frozen wire strings — paste, never
# paraphrase.
review:
  ci_gate:
    check: architect-review
    header: "**Opus/Architect review (automated)**"
    attestation: "*Fresh-session review: this session did not author the diff.*"
    triggers_on: null   # null means code_paths; a PR touching nothing under code_paths is not gated.

# ── agents ───────────────────────────────────────────────────────────────────
# `models` governs *session* routing (which model a person should be running), not what a
# spawned subagent runs as — an agent's model comes from its own frontmatter upstream.
agents:
  enabled: [architect, coder, security-critic, docs-consistency]
  diff_rule: null                # null means critic-gate's diff mode proposes and the human picks.
models:
  architect: opus
  coder: sonnet
  second_opinion: "fable"

# ── the sprint-orchestrator loop ─────────────────────────────────────────────
orchestration: null              # null means the loop never dispatches into this repo.

# ── declared identities ──────────────────────────────────────────────────────
# Trust is by numeric id, never by login. No dev_app.commit_route: main has no signature
# rule, so App-mode pushes take the default git route.
identities:
  maintainer:
    - { login: Seuss27, id: 22668449 }
  dev_app: { login: "glunk-dev[bot]", id: 339840170 }
  reviewer_app: { login: "glunk-review[bot]", id: 339841158 }
  loop_app: { login: "glunk-loop[bot]", id: 338193635 }
